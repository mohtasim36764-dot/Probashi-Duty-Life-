name: Update exchange rates and news
on:
  schedule:
    # 05:00, 09:00, 13:00 UTC = 8am, 12pm, 4pm Kuwait time
    - cron: "0 5,9,13 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.47.0
      - run: npx playwright install --with-deps chromium
      - run: node robot.js
      - name: Collect expat news
        if: always()
        continue-on-error: true
        run: node news.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-pages
          path: debug/
      - name: Save rates
        if: always()
        run: |
          git config user.name "rate-robot"
          git config user.email "rate-robot@users.noreply.github.com"
          git add rates.json; [ -f news.json ] && git add news.json
          git diff --cached --quiet || git commit -m "Update rates and news"
          git push
