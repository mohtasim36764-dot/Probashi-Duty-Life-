<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>DutyBook – প্রবাসী শ্রমিকের হিসাব</title>
<style>
:root{--g:#0f766e;--g2:#14b8a6;--bg:#f4f7f6;--card:#fff;--ink:#14211f;--mut:#5b6b68;--red:#dc2626;--yel:#d97706;--ok:#16a34a;--line:#e3e9e7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Bengali","Noto Sans Devanagari","Noto Naskh Arabic",sans-serif;font-size:18px}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:96px}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0;flex:1}
header small{display:block;font-size:13px;opacity:.85;font-weight:400}
.langbtn{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:22px;border-radius:12px;padding:6px 10px}
main{padding:12px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:18px;margin:0 0 10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6}
nav .in{display:flex;max-width:480px;width:100%}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:26px;line-height:1.1}
nav button.on{color:var(--g);font-weight:700}
nav button.on b{transform:scale(1.12)}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stamp{border:3px solid transparent;border-radius:14px;background:#eef4f3;padding:10px 4px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.stamp b{font-size:28px}
.stamp.on{border-color:var(--g);background:#ccfbf1}
.hint{color:var(--mut);font-size:15px;margin:8px 2px 0;text-align:center}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mhead button{border:0;background:#eef4f3;border-radius:12px;font-size:24px;width:48px;height:44px}
.mhead strong{font-size:19px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--mut);padding:2px 0}
.day{aspect-ratio:1/1.1;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;color:var(--ink);position:relative}
.day.fri{background:#fff7ed}
.day.today{outline:3px solid var(--g2)}
.day .ic{font-size:20px;line-height:1.1;min-height:22px}
.day .ot{position:absolute;bottom:1px;font-size:10px;color:#7c3aed;font-weight:700}
.day.blank{border:0;background:none}
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;text-align:center;font-size:13px}
.sum div{background:#eef4f3;border-radius:10px;padding:6px 2px}
.sum b{display:block;font-size:18px}
.sum .sl{display:block;font-size:11px;color:var(--mut);line-height:1.2;margin-top:2px}
label.f{display:block;margin:10px 0 4px;font-size:15px;color:var(--mut)}
input,select{width:100%;font-size:22px;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--g2)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:17px;gap:8px}
.row span:first-child{display:flex;gap:8px;align-items:center}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--red);font-weight:700}
.total{background:var(--g);color:#fff;border-radius:16px;padding:16px;text-align:center;margin-top:12px}
.total small{display:block;font-size:15px;opacity:.9}
.total b{display:block;font-size:34px;margin-top:4px}
.big{width:100%;border:0;border-radius:16px;background:var(--g2);color:#fff;font-size:20px;padding:14px;margin-top:10px;font-weight:700}
.big.alt{background:#eef4f3;color:var(--ink)}
.doc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.doc .e{font-size:34px}
.doc .t{flex:1}
.doc .t input{font-size:18px;padding:8px;margin-top:4px}
.badge{border-radius:12px;padding:6px 10px;font-size:15px;font-weight:700;text-align:center;min-width:92px}
.b-ok{background:#dcfce7;color:#166534}.b-y{background:#fef3c7;color:#92400e}.b-r{background:#fee2e2;color:#991b1b}.b-n{background:#eef4f3;color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.seg button{border:3px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;font-size:16px;color:var(--ink)}
.seg button.on{border-color:var(--g);background:#ccfbf1;font-weight:700}
.note{font-size:14px;color:var(--mut);margin-top:10px;line-height:1.5}
.soon{background:#fef3c7;border-radius:14px;padding:12px;font-size:16px;text-align:center;color:#92400e}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:380px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 6px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.langs button b{font-size:38px}
.counter{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0}
.counter button{width:64px;height:64px;border-radius:50%;border:0;background:#eef4f3;font-size:32px}
.counter b{font-size:44px;min-width:70px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#14211f;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;max-width:90%}
details summary{font-size:16px;color:var(--g);padding:6px 0;cursor:pointer}
[dir=rtl] .row,[dir=rtl] .doc{direction:rtl}
</style>

function nd(x){var s=String(x),m=DIG[D.lang];if(!m)return s;return s.replace(/[0-9]/g,function(c){return m[+c];});}
function money(x,dec){return nd((Math.round(x*Math.pow(10,dec))/Math.pow(10,dec)).toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g,","));}
function num(v){v=String(v==null?"":v).replace(/[০-৯]/g,function(c){return "০১২৩৪৫৬৭৮৯".indexOf(c);}).replace(/[०-९]/g,function(c){return "०१२३४५६७८९".indexOf(c);}).replace(/[٠-٩]/g,function(c){return "٠١٢٣٤٥٦٧٨٩".indexOf(c);}).replace(/[۰-۹]/g,function(c){return "۰۱۲۳۴۵۶۷۸۹".indexOf(c);}).replace(",",".");var n=parseFloat(v);return isNaN(n)?0:n;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ymd(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}

function gratCalc(){var g=D.grat,sal=num(g.salary);if(!g.start||!g.end||!sal)return null;

 var f=1;if(g.how==="resign"){f=yrs<3?0:yrs<5?.5:yrs<10?2/3:1;}

 [["gs","start"],["ge","end"],["gsal","salary"]].forEach(function(p){var e=$(p[0]);if(e)e.onchange=function(){D.grat[p[1]]=e.value.trim();save();render();};});

 if($("gsay"))$("gsay").onclick=function(){var r=gratCalc();if(r)speak(t("gResult")+" "+money(r.amt,3)+" "+t("kd"));};
 document.querySelectorAll("[data-rate]").forEach(function(b){b.onclick=function(){if(!b.dataset.rate)return;D.money.rate=b.dataset.rate;save();render();};});
 ["mamt","mrate"].forEach(function(id){var e=$(id);if(e)e.oninput=function(){D.money[id==="mamt"?"amt":"rate"]=e.value.trim();save();$("mres").textContent=money(num(D.money.amt)*num(D.money.rate),0)+" "+t("cur");};});
}
function tapDay(k){var r=D.days[k]||{};
 if(stamp==="erase"){delete D.days[k];save();render();return;}
 if(stamp==="ot"){otDialog(k,r.ot||2);return;}
 if(r.s===stamp)delete r.s;else r.s=stamp;
 if(!r.s&&!r.ot)delete D.days[k];else D.days[k]=r;save();render();}
function otDialog(k,v){var ov=document.createElement("div");ov.className="ov";
 ov.innerHTML='<div class="dlg"><h2 style="text-align:center;margin:0">⏱️ '+esc(t("otHours"))+'</h2><div class="counter"><button id="om">−</button><b id="ov">'+nd(v)+'</b><button id="op">+</button></div><div class="two"><button class="big alt" id="oc">'+esc(t("cancel"))+'</button><button class="big" id="ok">'+esc(t("ok"))+'</button></div></div>';
 document.body.appendChild(ov);var set=function(x){v=Math.max(0,Math.min(16,x));document.getElementById("ov").textContent=nd(v);};
 document.getElementById("om").onclick=function(){set(v-1);};document.getElementById("op").onclick=function(){set(v+1);};
 document.getElementById("oc").onclick=function(){ov.remove();};
 document.getElementById("ok").onclick=function(){var r=D.days[k]||{};if(v)r.ot=v;else delete r.ot;if(!r.s&&!r.ot)delete D.days[k];else D.days[k]=r;save();ov.remove();render();};}
function langDialog(){if(document.querySelector(".ov"))return;var ov=document.createElement("div");ov.className="ov";
 ov.innerHTML='<div class="dlg"><h2 style="text-align:center;margin:0 0 12px">🌐 ভাষা · Language · भाषा · زبان</h2><div class="langs">'+Object.keys(T).map(function(k){return '<button data-l="'+k+'"><b>'+T[k].flag+'</b>'+T[k].name+'</button>';}).join("")+'</div></div>';
 document.body.appendChild(ov);ov.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){D.lang=b.dataset.l;save();ov.remove();render();};});}
