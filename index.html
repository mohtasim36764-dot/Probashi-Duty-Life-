<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b1d4a">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icons/camel-192.png">
<link rel="apple-touch-icon" href="icons/camel-192.png">
<title>Probashi Duty Life – প্রবাসীর সাথী</title>
<style>
:root{--p:#0b5d56;--p2:#0f766e;--a:#14b8a6;--gold:#f59e0b;--bg:#f2f5f4;--card:#fff;--ink:#0f1f1d;--mut:#60706d;--line:#e2e8e6;--red:#dc2626;--ok:#15803d;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans Devanagari","Noto Naskh Arabic",sans-serif;font-size:17px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
a{color:var(--p2)}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px}
header{background:#3b1d4a;color:#fff;padding:16px 16px 22px;border-radius:0 0 26px 26px;position:relative;overflow:hidden;min-height:150px}
header.big{min-height:250px}
header .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,8,24,.55),rgba(20,8,24,0) 55%);z-index:0}
header>*:not(.scene){position:relative;z-index:1}
header .htitle,header .hsub{text-shadow:0 1px 6px rgba(0,0,0,.45)}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;background:#3b1d4a;color:#fff;transition:opacity .6s}
#splash{background:linear-gradient(180deg,#1f0f2b 0%,#3b1d4a 55%,#3b1d4a 100%)}
#splash .scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;max-height:75vh}
#splash .st{position:relative;margin-top:22vh;text-align:center;padding:0 24px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#splash .st b{display:block;font-size:30px;letter-spacing:.3px}
#splash .st span{display:block;margin-top:10px;font-size:18px;opacity:.95}
#splash.hide{opacity:0;pointer-events:none}
.top{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px}
.top h1{font-size:19px;margin:0;flex:1;letter-spacing:.2px}
.top h1 small{display:block;font-size:12.5px;opacity:.85;font-weight:400}
.langbtn{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:20px;border-radius:12px;padding:6px 10px}
.htitle{margin:14px 2px 0;font-size:22px;font-weight:700}
.hsub{margin:2px 2px 0;opacity:.88;font-size:14.5px}
main{padding:14px 12px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(15,31,29,.05)}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.lift{margin-top:-14px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button b{font-size:23px;line-height:1.15;width:46px;border-radius:14px;padding:2px 0}
nav button.on{color:var(--p);font-weight:700}
nav button.on b{background:#ccfbf1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;background:#fff;border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(15,31,29,.05)}
.tile i{font-style:normal;font-size:26px;width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.c1{background:#ccfbf1}.c2{background:#fef3c7}.c3{background:#dbeafe}.c4{background:#fce7f3}.c5{background:#ede9fe}.c6{background:#dcfce7}.c7{background:#fee2e2}.c8{background:#e0f2fe}.c9{background:#f1f5f9}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:18px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(15,31,29,.05);border:0;text-align:start;color:var(--ink)}
.stat small{display:block;color:var(--mut);font-size:12.5px}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat span{font-size:12px;color:var(--mut)}
.sec{font-size:14px;color:var(--mut);margin:16px 4px 8px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stamp{border:2px solid transparent;border-radius:16px;background:#f1f5f4;padding:10px 4px;font-size:14.5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink)}
.stamp b{font-size:26px}
.stamp.on{border-color:var(--p2);background:#ccfbf1;font-weight:700}
.hint{color:var(--mut);font-size:14px;margin:10px 2px 0;text-align:center}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mhead button{border:0;background:#f1f5f4;border-radius:12px;font-size:20px;width:46px;height:42px;color:var(--ink)}
.mhead strong{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:11.5px;color:var(--mut);padding:2px 0}
.day{aspect-ratio:1/1.1;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;color:var(--ink);position:relative}
.day.fri{background:#fffbeb}
.day.today{outline:3px solid var(--a)}
.day .ic{font-size:19px;line-height:1.1;min-height:21px}
.day .ot{position:absolute;bottom:1px;font-size:10px;color:#7c3aed;font-weight:700}
.day.blank{border:0;background:none}
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px;text-align:center;font-size:13px}
.sum div{background:#f1f5f4;border-radius:12px;padding:6px 2px}
.sum b{display:block;font-size:18px}
.sum .sl{display:block;font-size:10.5px;color:var(--mut);line-height:1.2;margin-top:2px}
label.f{display:block;margin:12px 0 5px;font-size:14px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-family:inherit}
textarea{font-size:15px;min-height:80px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(20,184,166,.15)}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:16px;gap:8px}
.row:last-child{border-bottom:0}
.row>span:first-child{display:flex;gap:8px;align-items:center}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--red);font-weight:700}
.total{background:linear-gradient(135deg,#0b5d56,#0f766e);color:#fff;border-radius:18px;padding:16px;text-align:center;margin-top:12px}
.total small{display:block;font-size:14px;opacity:.9}
.total b{display:block;font-size:32px;margin-top:2px;letter-spacing:.3px}
.btn{width:100%;border:0;border-radius:15px;background:var(--p2);color:#fff;font-size:17px;padding:14px;margin-top:10px;font-weight:700}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#111}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.doc:last-of-type{border-bottom:0}
.doc .e{font-size:30px;width:48px;height:48px;border-radius:15px;background:#f1f5f4;display:flex;align-items:center;justify-content:center}
.doc .t{flex:1}
.doc .t input{font-size:16px;padding:8px 10px;margin-top:4px}
.badge{border-radius:12px;padding:6px 9px;font-size:13.5px;font-weight:700;text-align:center;min-width:86px}
.b-ok{background:#dcfce7;color:#166534}.b-y{background:#fef3c7;color:#92400e}.b-r{background:#fee2e2;color:#991b1b}.b-n{background:#f1f5f4;color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;font-size:15px;color:var(--ink)}
.seg button.on{border-color:var(--p2);background:#ccfbf1;font-weight:700}
.note{font-size:13.5px;color:var(--mut);margin-top:10px;line-height:1.5}
.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;padding:12px 14px;font-size:14.5px;color:#7c2d12;line-height:1.5}
.info{background:#f0fdfa;border:1px solid #99f6e4;border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.link{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.link:last-child{border-bottom:0}
.link i{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.link div{flex:1}
.link b{display:block;font-size:15.5px}
.link small{color:var(--mut);font-size:13px}
.link .go{color:var(--p2);font-size:20px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:#dcfce7;color:#166534;margin-inline-start:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:14px;color:var(--ink)}
.chip.on{background:#ccfbf1;border-color:var(--p2);font-weight:700}
.exp{background:#f8faf9;border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:8px}
.exp .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.exp input{font-size:15px;padding:9px 10px;margin-top:6px}
.x{border:0;background:#fee2e2;color:#991b1b;border-radius:10px;padding:6px 10px;font-size:13px;margin-top:6px}
.photo{display:flex;align-items:center;gap:12px}
.photo img,.photo .ph{width:72px;height:88px;border-radius:12px;object-fit:cover;background:#f1f5f4;display:flex;align-items:center;justify-content:center;font-size:30px}
#cvp{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;font-family:Georgia,"Times New Roman",serif;color:#111;font-size:13.5px;line-height:1.45}
#cvp .hd{display:flex;gap:14px;align-items:center;border-bottom:3px solid #0b5d56;padding-bottom:10px;margin-bottom:10px}
#cvp .hd img{width:78px;height:96px;object-fit:cover;border-radius:6px}
#cvp h3{margin:0;font-size:21px;font-family:system-ui,sans-serif;color:#0b5d56}
#cvp h4{margin:12px 0 4px;font-size:12.5px;letter-spacing:1px;color:#0b5d56;font-family:system-ui,sans-serif;border-bottom:1px solid #d1d5db;padding-bottom:2px}
#cvp .jt{font-weight:700;font-family:system-ui,sans-serif;margin-top:2px}
#cvp ul{margin:4px 0;padding-inline-start:18px}
#cvp table{width:100%;border-collapse:collapse}
#cvp td{padding:2px 0;vertical-align:top}
#cvp td:first-child{width:38%;color:#444}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 6px;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.langs button b{font-size:34px}
.counter{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0}
.counter button{width:62px;height:62px;border-radius:50%;border:0;background:#f1f5f4;font-size:30px;color:var(--ink)}
.counter b{font-size:42px;min-width:70px;text-align:center}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#0f1f1d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:30;max-width:90%}
details summary{font-size:15px;color:var(--p2);padding:8px 0;cursor:pointer;font-weight:600}
.back{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:6px 12px;font-size:15px;margin-top:10px}
[dir=rtl] .row,[dir=rtl] .doc,[dir=rtl] .link{direction:rtl}
@media print{body{background:#fff}header,nav,.noprint,.toast{display:none!important}#app{padding:0;max-width:none}main{padding:0}.card{box-shadow:none;padding:0;margin:0}#cvp{border:0;padding:0;font-size:12.5px}}
</style>
</head>

 var a=s.absent*daily,dd=s.double*daily*num(D.dbl),ot=s.ot*hourly*(num(D.otRate)||1.25);return{s:s,sal:sal,a:a,dd:dd,ot:ot,tot:Math.max(0,sal-a+dd+ot)};}
function gratCalc(){var g=D.grat,sal=num(g.salary);if(!g.start||!g.end||!sal)return null;
 var a=new Date(g.start+"T00:00:00"),b=new Date(g.end+"T00:00:00");if(b<=a)return null;
 var yrs=(b-a)/864e5/365,full=Math.min(5,yrs)*15*(sal/26)+Math.max(0,yrs-5)*sal;full=Math.min(full,18*sal);

 [["Nationality",cv.nat],["Date of birth",cv.dob],["Languages",cv.langs],["Driving licence",cv.lic]].forEach(function(r){if(r[1])out.push(r[0]+": "+r[1]);});
 var ex=cv.exp.filter(function(e){return e.role||e.company;});if(ex.length){out.push("","WORK EXPERIENCE");ex.forEach(function(e){out.push("- "+[e.role,e.company,e.country,e.years?e.years+" year(s)":""].filter(Boolean).join(", "));});}
